[package]
name = "musicforge-format-plugins"
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
description = "MusicForge local format-migration plugins (L3, network=false) — separate distribution, disabled by default, acknowledgement required"

[lib]
name = "musicforge_format_plugins"
path = "src/lib.rs"

[[bin]]
name = "kwm-migration"
path = "src/bin/kwm_migration.rs"

[[bin]]
name = "qmc-migration"
path = "src/bin/qmc_migration.rs"

[dependencies]
musicforge-plugin-api = { path = "../MusicForge/musicforge-plugin-api" }
serde_json = "1"
# L3 校验器：产物 magic + 音频属性双验（纯解析，零网络）
lofty = "0.25"
# 审计行 + KWM 内嵌密钥解出
sha2 = "0.10"
aes = "0.8"
# X49（QMCv2）：ekey 解析（base64）+ 腾讯 TEA 变体解密（crates.io 公开 crate，MIT）
base64 = "0.22"
tc_tea = "0.1.4"

[profile.release]
lto = true
opt-level = "z"
strip = true
